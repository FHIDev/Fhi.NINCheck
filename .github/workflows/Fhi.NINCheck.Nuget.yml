name: Fhi.NINCheck.Nuget

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    name: Build, pack & publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets GitHub issue the OIDC token
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack /p:ContinuousIntegrationBuild=true --output package

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not email

      - name: Publish nupkg and snupkg to NuGet.org
        run: |
          foreach($file in (Get-ChildItem -Path package -Recurse -Include "*.nupkg")) {
              Write-Host "Publishing nupkg and snupkg:: " $file.FullName
              dotnet nuget push $file.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }